name = "profilehtml-calendar"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "profilehtml.calendar.ciallo.com", custom_domain = true }
]

# 每分鐘抓一次 GitHub 資料
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "CACHE"
# 不填 id：wrangler 4.45+ 會在部署時自動建立並綁定 KV

[vars]
GITHUB_USER = "lf94878964"